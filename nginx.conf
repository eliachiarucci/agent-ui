server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve `app` through Docker's embedded DNS so nginx starts even when
  # the app container is down and survives its IP changing on restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /agent/ {
    set $upstream http://app:3001;
    # No URI on proxy_pass: the original /agent/* path is forwarded as-is.
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # POST /agent/conversation streams tokens; buffering would batch them.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 20m;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA history fallback for client-side routes.
  location / {
    try_files $uri /index.html;
  }
}
